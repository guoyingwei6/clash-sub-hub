name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "确认执行生产部署"
        required: true
        type: choice
        options:
          - "NO"
          - "DEPLOY_PRODUCTION"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run check

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.confirm_production == 'DEPLOY_PRODUCTION'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: clash-sub-hub-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate embedded assets
        run: npm run generate

      - name: Validate required deployment secrets
        run: test -n "$ADMIN_PASSWORD" && test -n "$MIRROR_UPLOAD_SECRET"
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MIRROR_UPLOAD_SECRET: ${{ secrets.MIRROR_UPLOAD_SECRET }}

      - name: Deploy to Cloudflare Workers
        run: npm exec -- wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set admin password secret
        run: printf '%s' "$ADMIN_PASSWORD" | npm exec -- wrangler secret put ADMIN_PASSWORD
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Set mirror upload secret
        run: printf '%s' "$MIRROR_UPLOAD_SECRET" | npm exec -- wrangler secret put MIRROR_UPLOAD_SECRET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIRROR_UPLOAD_SECRET: ${{ secrets.MIRROR_UPLOAD_SECRET }}
