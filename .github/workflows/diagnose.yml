name: Diagnose subscription refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture one refresh failure without logging credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          const redact = value => String(value).replace(/https?:\/\/[^\s"<>]+/g, '[URL]').replace(/[A-Za-z0-9_-]{24,}/g, '[REDACTED]');
          const tail = spawn(process.execPath, ['node_modules/wrangler/bin/wrangler.js', 'tail', '--format', 'json']);
          let output = '';
          tail.stdout.on('data', chunk => output += chunk);
          tail.stderr.on('data', chunk => output += chunk);
          try {
            await new Promise(resolve => setTimeout(resolve, 8000));
            const base = 'https://clash.guoyingwei.top';
            const login = await fetch(base + '/api/admin/session', { method: 'POST', headers: { Authorization: `Bearer ${process.env.ADMIN_PASSWORD}` } });
            if (!login.ok) throw new Error('Cannot create admin session');
            const cookie = login.headers.get('set-cookie');
            if (!cookie?.includes('Max-Age=2592000')) throw new Error('Session duration is not 30 days');
            console.log('SESSION', login.status, '30 days');
            const headers = { Cookie: cookie.split(';', 1)[0] };
            const list = await fetch(base + '/api/upstreams', { headers });
            console.log('LIST', list.status);
            if (!list.ok) throw new Error('Cannot read upstreams');
            const upstreams = await list.json();
            const edit = upstreams.find(item => item.fetchMode === 'disabled');
            if (edit) {
              const saved = await fetch(base + '/api/upstreams/' + encodeURIComponent(edit.name), { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({url:edit.url,userAgent:edit.userAgent,prefix:edit.prefix,exclude:edit.exclude,fetchMode:edit.fetchMode}) });
              console.log('SAVE_DISABLED', saved.status);
              if (!saved.ok) throw new Error('Disabled upstream save failed');
              const after = await (await fetch(base + '/api/upstreams', { headers })).json();
              if (after.find(item => item.name === edit.name)?.fetchMode !== 'disabled') throw new Error('Save unexpectedly enabled upstream');
              console.log('DISABLED_PRESERVED', true);
            }
            const upstream = upstreams.find(item => item.fetchMode === 'server' && item.nodeCount > 0);
            if (!upstream) throw new Error('No configured server upstream available');
            const response = await fetch(base + '/api/upstreams/' + encodeURIComponent(upstream.name) + '/refresh', { method: 'POST', headers, signal: AbortSignal.timeout(45000) });
            const body = await response.text();
            console.log('REFRESH', response.status, response.headers.get('content-type'), response.headers.get('cf-ray'));
            try {
              const data = JSON.parse(body);
              console.log(JSON.stringify({ok:data.ok,error:redact(data.error ?? ''),nodeCount:data.nodeCount,artifactReady:data.artifactReady}));
            } catch {
              console.log('NON_JSON', redact(body.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ')).slice(0, 1400));
            }
            await new Promise(resolve => setTimeout(resolve, 6000));
          } finally {
            tail.kill('SIGINT');
            for (const match of output.matchAll(/"(?:message|outcome)"\s*:\s*("(?:\\.|[^"\\])*")/g)) {
              console.log('WORKER', redact(JSON.parse(match[1])).slice(0, 1200));
            }
            if (!output.includes('"outcome"')) console.log('TAIL', redact(output).slice(0, 700));
          }
          NODE
