name: Diagnose node details
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - name: Read node counts without logging node data
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://clash.guoyingwei.top';
          const login = await fetch(base + '/api/admin/session', { method:'POST', headers:{Authorization:`Bearer ${process.env.ADMIN_PASSWORD}`} });
          if (!login.ok) throw new Error('Login failed');
          const headers = {Cookie:login.headers.get('set-cookie').split(';',1)[0]};
          const list = await fetch(base + '/api/upstreams', {headers});
          if (!list.ok) throw new Error('List failed');
          const upstreams = await list.json();
          const settings = await (await fetch(base + '/api/settings', {headers})).json();
          console.log('FILTER_ENABLED', settings.filterEnabled);
          for (const [index,upstream] of upstreams.entries()) {
            const response = await fetch(base + '/api/upstreams/' + encodeURIComponent(upstream.name) + '/nodes', {headers});
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch {}
            console.log(JSON.stringify({index,reported:upstream.nodeCount,status:response.status,total:data?.total,filtered:data?.filtered,returned:data?.nodes?.length,ray:response.headers.get('cf-ray'),error:typeof data?.error==='string'?data.error.replace(/https?:\/\/\S+/g,'[URL]'):undefined}));
            if (data?.total > 0 && data?.filtered === 0) {
              const probe = await fetch(base + '/api/upstreams/' + encodeURIComponent(upstream.name) + '/test', {method:'POST',headers});
              const result = await probe.json();
              console.log('FILTER_MATCHES', JSON.stringify({index,status:probe.status,count:result.nodeCount,matches:result.preview?.map(name=>name.match(/官网|套餐|流量|异常|剩余|ISP|all|免费|低倍率|0\.[0-9]x|测试|到期/gi))}));
            }
          }
          NODE
